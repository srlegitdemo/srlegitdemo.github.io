<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>To-Do · Serge</title>
  <meta name="description" content="A tiny to-do list. Saved on this device only. Nothing is sent anywhere.">
  <meta name="theme-color" content="#0b0d0c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #0b0d0c;
      --surface: #131615;
      --surface-2: #1b1f1d;
      --line: #262b29;
      --ink: #f2f3ee;
      --muted: #a4aaa5;
      --accent: #c8f560;
      --accent-ink: #0b0d0c;
      /* No web fonts: nothing is downloaded. Uses the bio page's font only if it is installed locally. */
      --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(200, 245, 96, 0.10), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--font);
      font-size: 1.0625rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(32px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 4px;
      margin-left: -4px;
      color: var(--muted);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
    }
    .back:hover { color: var(--ink); }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 20px;
    }

    h1 {
      margin: 0;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .count {
      margin: 0;
      color: var(--muted);
      font-size: 0.9375rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .count strong { color: var(--accent); font-weight: 700; }

    /* The add form sticks to the top, so it stays visible on a phone while the list scrolls. */
    .add {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 10px;
      padding: 12px 0;
      margin: 0 0 8px;
      background: transparent;
      transition: background-color .15s ease, box-shadow .15s ease;
    }
    /* Only when it is stuck to the top does the bar get a solid background (so tasks scroll under it cleanly). */
    .add.stuck {
      background: var(--bg);
      box-shadow: 0 1px 0 var(--line);
      margin-left: -20px;
      margin-right: -20px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .add input {
      flex: 1;
      min-width: 0;
      min-height: 56px;
      padding: 0 18px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 1.0625rem; /* 17px: big enough that iOS does not zoom in on focus */
    }
    .add input::placeholder { color: var(--muted); opacity: 1; }
    .add input:hover { border-color: #3a413e; }

    .btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      min-width: 56px;
      padding: 0 20px;
      border-radius: var(--radius);
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
    }
    .btn:hover { background: #d6fa82; border-color: #d6fa82; }
    .btn:active { transform: scale(0.97); }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .add input:focus-visible { outline-offset: 2px; border-color: var(--accent); }
    .btn:focus-visible { outline-color: var(--ink); }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 60px;
      padding: 4px 4px 4px 6px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: opacity .15s ease;
    }

    .item label {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 0 6px;
      cursor: pointer;
    }

    /* Real checkbox, restyled: keeps Tab + Space working and screen readers informed. */
    .item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      width: 28px;
      height: 28px;
      margin: 8px;
      border-radius: 50%;
      border: 2px solid #4a524e;
      background: transparent;
      display: grid;
      place-content: center;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .item input[type="checkbox"]:hover { border-color: var(--accent); }
    .item input[type="checkbox"]::after {
      content: "";
      width: 11px;
      height: 6px;
      border-left: 2.5px solid var(--accent-ink);
      border-bottom: 2.5px solid var(--accent-ink);
      transform: translateY(-1px) rotate(-45deg);
      opacity: 0;
    }
    .item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .item input[type="checkbox"]:checked::after { opacity: 1; }

    .text {
      overflow-wrap: anywhere;
      padding: 10px 0;
    }

    .item.done { opacity: 0.5; }
    .item.done:focus-within { opacity: 1; } /* keep the keyboard focus ring fully visible */
    .item.done .text { text-decoration: line-through; color: var(--muted); }

    .delete {
      flex: none;
      display: grid;
      place-content: center;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .delete:hover { background: var(--surface-2); color: var(--ink); }
    .delete svg { width: 20px; height: 20px; }

    .empty {
      margin: 8px 0 0;
      padding: 32px 20px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }
    .empty strong { display: block; color: var(--ink); font-size: 1.125rem; margin-bottom: 4px; }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .clear {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
    }
    .clear:hover { background: var(--surface-2); border-color: #3a413e; }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    [hidden] { display: none !important; }

    @media (min-width: 768px) {
      main { padding-top: 72px; }
      h1 { font-size: 2.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, .item, .item input[type="checkbox"] { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← Serge</a>

    <header>
      <h1>To-do</h1>
      <p class="count" id="count" aria-live="polite"></p>
    </header>

    <div id="add-sentinel" aria-hidden="true"></div>
    <form class="add" id="add-form" autocomplete="off">
      <label for="new-task" class="sr-only">New task</label>
      <input id="new-task" type="text" placeholder="Add a task…" maxlength="200" enterkeyhint="done" required>
      <button class="btn" type="submit">Add</button>
    </form>

    <p class="empty" id="empty" hidden>
      <strong>Nothing to do yet</strong>
      Type a task above and press Enter or tap Add.
    </p>

    <ul class="list" id="list" aria-label="Tasks"></ul>

    <div class="actions" id="actions" hidden>
      <button class="clear" id="clear-done" type="button">Clear done</button>
    </div>

    <footer>Saved on this device only. Nothing is sent anywhere.</footer>
  </main>

  <script>
    (function () {
      "use strict";

      var KEY = "todo.tasks.v1";
      var form = document.getElementById("add-form");
      var input = document.getElementById("new-task");
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");
      var count = document.getElementById("count");
      var actions = document.getElementById("actions");
      var clearBtn = document.getElementById("clear-done");

      var tasks = load();

      function load() {
        try {
          var data = JSON.parse(localStorage.getItem(KEY) || "[]");
          if (!Array.isArray(data)) return [];
          return data.filter(function (t) {
            return t && typeof t.id === "string" && typeof t.text === "string";
          }).map(function (t) {
            return { id: t.id, text: t.text, done: !!t.done };
          });
        } catch (e) {
          return [];
        }
      }

      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) { /* storage full or blocked: keep working in memory */ }
      }

      function newId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      var deleteIcon =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
        '<path d="M6 6l12 12M18 6L6 18"/></svg>';

      function render(focusId, focusWhat) {
        // Open tasks first, done tasks at the bottom (order inside each group is kept).
        var ordered = tasks.filter(function (t) { return !t.done; })
          .concat(tasks.filter(function (t) { return t.done; }));

        list.textContent = "";
        ordered.forEach(function (t) {
          var li = document.createElement("li");
          li.className = "item" + (t.done ? " done" : "");
          li.dataset.id = t.id;

          var label = document.createElement("label");
          var box = document.createElement("input");
          box.type = "checkbox";
          box.checked = t.done;
          box.dataset.action = "toggle";
          var span = document.createElement("span");
          span.className = "text";
          span.textContent = t.text; // textContent: task text is never treated as HTML
          label.appendChild(box);
          label.appendChild(span);

          var del = document.createElement("button");
          del.type = "button";
          del.className = "delete";
          del.dataset.action = "delete";
          del.setAttribute("aria-label", "Delete: " + t.text);
          del.innerHTML = deleteIcon;

          li.appendChild(label);
          li.appendChild(del);
          list.appendChild(li);
        });

        var left = tasks.filter(function (t) { return !t.done; }).length;
        var doneCount = tasks.length - left;

        empty.hidden = tasks.length > 0;
        list.hidden = tasks.length === 0;
        actions.hidden = doneCount === 0;
        clearBtn.textContent = "Clear done (" + doneCount + ")";

        if (tasks.length === 0) {
          count.textContent = "";
        } else if (left === 0) {
          count.textContent = "All done 🎉";
        } else {
          count.innerHTML = "<strong>" + left + "</strong> " + (left === 1 ? "task" : "tasks") + " left";
        }

        if (focusId) {
          var row = list.querySelector('[data-id="' + focusId + '"]');
          var target = row && row.querySelector('[data-action="' + (focusWhat || "toggle") + '"]');
          if (target) target.focus();
        }
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) { input.value = ""; input.focus(); return; }
        tasks.push({ id: newId(), text: text.slice(0, 200), done: false });
        save();
        input.value = "";
        render();
        input.focus();
      });

      list.addEventListener("change", function (e) {
        if (e.target.dataset.action !== "toggle") return;
        var id = e.target.closest(".item").dataset.id;
        tasks.forEach(function (t) { if (t.id === id) t.done = e.target.checked; });
        save();
        render(id, "toggle"); // keep keyboard focus on the same task after it moves
      });

      list.addEventListener("click", function (e) {
        var btn = e.target.closest('[data-action="delete"]');
        if (!btn) return;
        var row = btn.closest(".item");
        var next = row.nextElementSibling || row.previousElementSibling;
        var nextId = next && next.dataset.id;
        tasks = tasks.filter(function (t) { return t.id !== row.dataset.id; });
        save();
        render(nextId, "delete");
        if (!nextId) input.focus();
      });

      clearBtn.addEventListener("click", function () {
        tasks = tasks.filter(function (t) { return !t.done; });
        save();
        render();
        input.focus();
      });

      // Keep lists in sync if the app is open in two tabs.
      window.addEventListener("storage", function (e) {
        if (e.key === KEY) { tasks = load(); render(); }
      });

      // Give the add bar a background only once it is stuck to the top.
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          form.classList.toggle("stuck", !entries[0].isIntersecting);
        }).observe(document.getElementById("add-sentinel"));
      }

      render();
    })();
  </script>
</body>
</html>
