<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Nothing leaves the device: the browser blocks every outside request, even by mistake. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>To-do · Serge</title>
  <meta name="description" content="A tiny to-do list that saves on this device only.">
  <meta name="theme-color" content="#0b0d0c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="To-do">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #0b0d0c;
      --surface: #131615;
      --surface-2: #1b1f1d;
      --line: #262b29;
      --ink: #f2f3ee;
      --muted: #a4aaa5;
      --accent: #c8f560;
      --accent-ink: #0b0d0c;
      --danger: #ff8a7a;
      /* System fonts only: no font downloads. */
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(200, 245, 96, 0.10), transparent 70%),
        var(--bg);
      background-repeat: no-repeat;
      color: var(--ink);
      font-family: var(--font);
      font-size: 1.0625rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: max(32px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9375rem;
      border-radius: 10px;
    }
    .back:hover { color: var(--ink); }

    h1 {
      margin: 8px 0 4px;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .count {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* The add bar sticks to the top so it stays in reach on long lists. */
    .add {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 10px;
      padding: 12px 0;
      margin: 0 0 8px;
      background: transparent;
    }
    /* Only paint a backdrop once the bar is pinned over scrolled tasks. */
    .add.stuck {
      background: var(--bg);
      box-shadow: 0 1px 0 var(--line);
    }

    .add input {
      flex: 1;
      min-width: 0;
      min-height: 56px;
      padding: 0 18px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 1.0625rem; /* 17px: stops iOS zooming in on focus */
    }
    .add input::placeholder { color: var(--muted); opacity: 1; }
    .add input:hover { border-color: #3a413e; }

    .btn {
      min-height: 56px;
      padding: 0 22px;
      border-radius: var(--radius);
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .15s ease, transform .15s ease;
    }
    .btn:hover { background: #d6fa82; }
    .btn:active { transform: scale(0.97); }

    :focus { outline: none; }
    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .btn:focus-visible { outline-color: var(--ink); }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 60px;
      padding: 4px 4px 4px 6px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .task label {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 6px 8px;
      cursor: pointer;
    }

    .task input[type="checkbox"] {
      flex: none;
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #4a524e;
      background: transparent;
      display: grid;
      place-content: center;
      cursor: pointer;
    }
    .task input[type="checkbox"]::after {
      content: "";
      width: 12px;
      height: 7px;
      border: solid var(--accent-ink);
      border-width: 0 0 3px 3px;
      transform: translateY(-2px) rotate(-45deg);
      opacity: 0;
    }
    .task input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .task input[type="checkbox"]:checked::after { opacity: 1; }

    .task .text {
      overflow-wrap: anywhere;
      font-weight: 500;
    }

    .task.done { opacity: 0.5; }
    .task.done:focus-within { opacity: 1; } /* keep the focus ring bright for keyboard users */
    .task.done .text { text-decoration: line-through; color: var(--muted); }

    .delete {
      flex: none;
      width: 48px;
      height: 48px;
      display: grid;
      place-content: center;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .delete:hover { background: var(--surface-2); color: var(--danger); }
    .delete svg { width: 20px; height: 20px; }

    .empty {
      margin: 8px 0 0;
      padding: 28px 20px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }
    .empty strong { display: block; color: var(--ink); font-size: 1.125rem; margin-bottom: 4px; }

    .bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .clear {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
    }
    .clear:hover { background: var(--surface-2); border-color: #3a413e; }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    [hidden] { display: none !important; }

    @media (min-width: 768px) {
      main { padding-top: 72px; }
      h1 { font-size: 2.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← Serge</a>
    <h1>To-do</h1>
    <p class="count" id="count" aria-live="polite"></p>

    <div id="stick-sentinel" aria-hidden="true"></div>
    <form class="add" id="add-form" autocomplete="off">
      <label class="sr-only" for="new-task">New task</label>
      <input id="new-task" name="task" type="text" placeholder="Add a task…" maxlength="200" enterkeyhint="done" required>
      <button class="btn" type="submit">Add</button>
    </form>

    <ul class="list" id="list" aria-label="Tasks"></ul>

    <p class="empty" id="empty" hidden>
      <strong>Nothing to do yet</strong>
      Type a task above and press Enter or tap Add.
    </p>

    <div class="bar" id="bar" hidden>
      <button class="clear" id="clear-done" type="button">Clear done</button>
    </div>

    <footer>Saved on this device only. Nothing is sent anywhere.</footer>
  </main>

  <script>
    (function () {
      "use strict";

      var KEY = "serge-todo-v1";
      var form = document.getElementById("add-form");
      var input = document.getElementById("new-task");
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");
      var bar = document.getElementById("bar");
      var clearBtn = document.getElementById("clear-done");
      var count = document.getElementById("count");

      var tasks = load();

      function load() {
        try {
          var data = JSON.parse(localStorage.getItem(KEY) || "[]");
          if (!Array.isArray(data)) return [];
          return data.filter(function (t) {
            return t && typeof t.id === "string" && typeof t.text === "string";
          }).map(function (t) {
            return { id: t.id, text: t.text, done: !!t.done, at: Number(t.at) || 0 };
          });
        } catch (e) {
          return [];
        }
      }

      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) { /* storage full or blocked: keep working in memory */ }
      }

      function newId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      // Open tasks first (oldest at top), done tasks after (in the order they were ticked).
      function sorted() {
        return tasks.slice().sort(function (a, b) {
          if (a.done !== b.done) return a.done ? 1 : -1;
          return a.at - b.at;
        });
      }

      var trashSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

      function render() {
        list.textContent = "";
        sorted().forEach(function (t) {
          var li = document.createElement("li");
          li.className = "task" + (t.done ? " done" : "");
          li.dataset.id = t.id;

          var label = document.createElement("label");
          var box = document.createElement("input");
          box.type = "checkbox";
          box.checked = t.done;
          box.id = "t-" + t.id;
          box.dataset.action = "toggle";
          var span = document.createElement("span");
          span.className = "text";
          span.textContent = t.text; // textContent, never innerHTML, for user text
          label.appendChild(box);
          label.appendChild(span);

          var del = document.createElement("button");
          del.type = "button";
          del.className = "delete";
          del.id = "d-" + t.id;
          del.dataset.action = "delete";
          del.setAttribute("aria-label", "Delete: " + t.text);
          del.innerHTML = trashSvg;

          li.appendChild(label);
          li.appendChild(del);
          list.appendChild(li);
        });

        var left = tasks.filter(function (t) { return !t.done; }).length;
        var doneCount = tasks.length - left;

        empty.hidden = tasks.length > 0;
        bar.hidden = doneCount === 0;
        clearBtn.textContent = "Clear done (" + doneCount + ")";

        if (tasks.length === 0) count.textContent = "Your list is empty.";
        else if (left === 0) count.textContent = "All done. Nice.";
        else count.textContent = left + (left === 1 ? " task left" : " tasks left");
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = input.value.trim().replace(/\s+/g, " ");
        if (!text) { input.value = ""; input.focus(); return; }
        tasks.push({ id: newId(), text: text.slice(0, 200), done: false, at: Date.now() });
        save();
        render();
        input.value = "";
        input.focus();
      });

      list.addEventListener("change", function (e) {
        var el = e.target;
        if (el.dataset.action !== "toggle") return;
        var id = el.closest(".task").dataset.id;
        tasks.forEach(function (t) {
          if (t.id === id) { t.done = el.checked; t.at = Date.now(); }
        });
        save();
        render();
        // The task moved; keep keyboard focus on it.
        var again = document.getElementById("t-" + id);
        if (again) again.focus();
      });

      list.addEventListener("click", function (e) {
        var btn = e.target.closest('[data-action="delete"]');
        if (!btn) return;
        var li = btn.closest(".task");
        var id = li.dataset.id;
        // Pick where focus goes next: the next task's delete button, else the previous, else the input.
        var next = li.nextElementSibling || li.previousElementSibling;
        var nextId = next ? next.dataset.id : null;
        tasks = tasks.filter(function (t) { return t.id !== id; });
        save();
        render();
        var target = nextId && document.getElementById("d-" + nextId);
        (target || input).focus();
      });

      clearBtn.addEventListener("click", function () {
        tasks = tasks.filter(function (t) { return !t.done; });
        save();
        render();
        input.focus();
      });

      // Keep tabs in sync if the page is open twice.
      window.addEventListener("storage", function (e) {
        if (e.key === KEY) { tasks = load(); render(); }
      });

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          form.classList.toggle("stuck", !entries[0].isIntersecting);
        }).observe(document.getElementById("stick-sentinel"));
      }

      render();
    })();
  </script>
</body>
</html>
