<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serge · I build a company with AI, in public</title>
  <meta name="description" content="Serge builds a company with AI, in public, and teaches you how. Join AI Builders Lab, or follow along on Instagram and TikTok.">
  <meta name="theme-color" content="#0b0d0c">
  <link rel="canonical" href="https://srlegitdemo.github.io/">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Serge · I build a company with AI, in public">
  <meta property="og:description" content="Serge builds a company with AI, in public, and teaches you how. Join AI Builders Lab, or follow along on Instagram and TikTok.">
  <meta property="og:url" content="https://srlegitdemo.github.io/">
  <meta property="og:image" content="https://srlegitdemo.github.io/serge.jpg">
  <meta property="og:image:width" content="560">
  <meta property="og:image:height" content="560">
  <meta property="og:image:alt" content="Serge at his podcast microphone, wearing a black cap and hoodie">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d0c;
      --surface: #131615;
      --surface-2: #1b1f1d;
      --line: #262b29;
      --ink: #f2f3ee;
      --muted: #a4aaa5;
      --accent: #c8f560;
      --accent-ink: #0b0d0c;
      --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(200, 245, 96, 0.10), transparent 70%),
        var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 1.0625rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .photo {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 6px var(--bg), 0 0 0 7px var(--line);
      background: var(--surface);
    }

    h1 {
      margin: 22px 0 6px;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .tagline {
      margin: 0 0 32px;
      max-width: 30ch;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 60px;
      padding: 14px 20px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 600;
      font-size: 1.0625rem;
      text-decoration: none;
      transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
    }

    .btn:hover { background: var(--surface-2); border-color: #3a413e; }
    .btn:active { transform: scale(0.985); }

    .btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .btn svg { flex: none; width: 22px; height: 22px; }
    .btn .label { flex: 1; text-align: left; }
    .btn .arrow { color: var(--muted); }

    .btn--main {
      min-height: 76px;
      padding: 18px 22px;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-size: 1.1875rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .btn--main:hover { background: #d6fa82; border-color: #d6fa82; }
    .btn--main:focus-visible { outline-color: var(--ink); }
    .btn--main .arrow { color: var(--accent-ink); }
    .btn--main small {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      opacity: 0.75;
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.875rem;
    }

    @media (min-width: 768px) {
      main { padding-top: 88px; }
      .photo { width: 152px; height: 152px; }
      h1 { font-size: 2.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="serge.jpg" width="560" height="560"
         alt="Serge at his podcast microphone, wearing a black cap and hoodie">

    <h1>Serge</h1>
    <p class="tagline">I build a company with AI, in public, and teach you how.</p>

    <ul class="links">
      <li>
        <a class="btn btn--main" href="https://www.skool.com/ai-marketing-lab/about">
          <span class="label">Join AI Builders Lab<small>Step-by-step builds, on Skool</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="btn" href="https://withserge.dev/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5z"/></svg>
          <span class="label">My website</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="btn" href="https://www.instagram.com/withserge/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
          <span class="label">Instagram</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="btn" href="https://www.tiktok.com/@withsergedev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.2 4.4 5 4.6"/></svg>
          <span class="label">TikTok</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>

    <footer>withserge · <a href="todo/" style="color: inherit; display: inline-block; padding: 12px 4px">My to-do app</a></footer>
  </main>
</body>
</html>
